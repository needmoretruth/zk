# What this workspace accepts from its dependencies, checked by `cargo deny check`.
#
# The museum links code from many ecosystems. A licence that obliges derived works to be released
# under the same terms, or restricts hosting, cannot enter the binary, and a crate that compiles C or
# C++ cannot either (checked separately in review). Everything below is permissive.

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    # unicode-ident, pulled in by nearly every procedural macro; permissive, see the decision log.
    "Unicode-3.0",
    # foldhash, pulled in by hashbrown; permissive, see the decision log.
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Proof systems from different ecosystems pin different majors of the same crates on purpose.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git dependencies are allowed only from repositories named here, each pinned to a commit.
allow-git = [
    # lambdaworks: the PLONK exhibit (Apache-2.0 at the repository root).
    "https://github.com/lambdaclass/lambdaworks",
    # bulletproofs: the R1CS prover sits behind the `yoloproofs` feature, which the published crate
    # does not enable (MIT at the repository root).
    "https://github.com/zkcrypto/bulletproofs",
    # jellyfish: the TurboPlonk/UltraPlonk exhibit; not published to crates.io (MIT at the root).
    "https://github.com/EspressoSystems/jellyfish",
    # jellyfish's own dependencies: espresso-systems-common (MIT) and spongefish (Apache-2.0).
    "https://github.com/espressosystems/espresso-systems-common",
    "https://github.com/arkworks-rs/spongefish.git",
]

[advisories]
yanked = "warn"
ignore = [
    # `paste` is a macro Plonky3 uses at compile time; the advisory says it is no longer maintained,
    # not that it is unsafe, and nothing of it runs in the program.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro used by Plonky3; no known vulnerability" },
    # bincode 1.3.3 is how Spartan writes its proofs; its authors call that version complete.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained, required by spartan 0.9.0; no known vulnerability" },
    # clear_on_drop zeroes the Bulletproofs prover's secrets; nothing in this program is a real secret.
    { id = "RUSTSEC-2026-0283", reason = "unmaintained, required by bulletproofs; no known vulnerability" },
    { id = "RUSTSEC-2024-0388", reason = "unmaintained derive macro, required by jellyfish; no known vulnerability" },
    # tracing-subscriber 0.2 comes with ark-relations 0.5 for jellyfish. The flaw is in formatting logged
    # input for a terminal; this program installs no subscriber and logs nothing, so that code never runs.
    { id = "RUSTSEC-2025-0055", reason = "no tracing subscriber is installed; nothing is logged" },
    # lambdaworks' STARK prover lists serde_cbor as a dependency but never calls it; proofs are written with bincode.
    { id = "RUSTSEC-2021-0127", reason = "unmaintained, required by stark-platinum-prover but never called; no known vulnerability" },
]

# lambdaworks-plonk inherits no license field from its manifest; the repository is Apache-2.0
# (LICENSE at its root and `license = "Apache-2.0"` in the workspace manifest).
[[licenses.clarify]]
crate = "lambdaworks-plonk"
expression = "Apache-2.0"
license-files = []
