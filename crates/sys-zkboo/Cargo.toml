[package]
name = "sys-zkboo"
description = "ZKBoo (Giacomelli, Madsen, Orlandi 2016): the prover runs a three-party computation of the circuit in its head and opens two views per challenge, trusting nothing but a hash. A teaching implementation of the paper's linear (2,3)-decomposition."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Built from source only; nothing here is published to crates.io (see the README).
publish = false

[dependencies]
zk-core = { path = "../zk-core" }
zk-circuit = { path = "../zk-circuit" }
zk-examples = { path = "../zk-examples" }
p3-field = "0.7.0"
p3-goldilocks = "0.7.0"
sha2 = { version = "0.11", default-features = false }
getrandom = "0.4"

[lints]
workspace = true
