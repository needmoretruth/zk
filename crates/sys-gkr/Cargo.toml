[package]
name = "sys-gkr"
description = "GKR, the sum-check-per-layer proof for layered circuits, run by Worldcoin's Remainder with its Hyrax zero-knowledge wrapper over BN254 on the museum's seven statements."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Built from source only; nothing here is published to crates.io (see the README).
publish = false

[dependencies]
zk-core = { path = "../zk-core" }
zk-circuit = { path = "../zk-circuit" }
zk-examples = { path = "../zk-examples" }
# Remainder is not published to crates.io; all four crates come from one pinned commit. `frontend` builds
# the layered circuit, `remainder` holds its layers, `hyrax` proves and verifies it in zero knowledge.
remainder = { git = "https://github.com/worldcoin/Remainder_CE", rev = "5687fe7f3a077c75c374422ef79f22e3860de9c1" }
frontend = { git = "https://github.com/worldcoin/Remainder_CE", rev = "5687fe7f3a077c75c374422ef79f22e3860de9c1" }
hyrax = { git = "https://github.com/worldcoin/Remainder_CE", rev = "5687fe7f3a077c75c374422ef79f22e3860de9c1" }
shared-types = { git = "https://github.com/worldcoin/Remainder_CE", rev = "5687fe7f3a077c75c374422ef79f22e3860de9c1" }
# Remainder writes its proofs with `bincode::serialize` (bincode 1), so the museum does too.
bincode = "1.3.3"
# Hyrax's prover takes its blinding randomness as a rand 0.8 `CryptoRng`.
rand = "0.8.5"
# Not used directly. Remainder's Ligero crate pulls in Blake3, whose build script otherwise assembles
# SIMD code with the system C compiler; `pure` keeps it to Rust alone.
blake3 = { version = "1.8", default-features = false, features = ["pure"] }

[lints]
workspace = true
