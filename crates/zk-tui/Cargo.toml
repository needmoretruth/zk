[package]
name = "zk-tui"
description = "The screens of nmtzk: a transcript of results above a composer where slash commands are typed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Built from source only; nothing here is published to crates.io (see the README).
publish = false

[dependencies]
zk-core = { path = "../zk-core" }
zk-i18n = { path = "../zk-i18n" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29"
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-width = "0.2"

[lints]
workspace = true
