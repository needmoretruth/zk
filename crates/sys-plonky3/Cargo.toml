[package]
name = "sys-plonky3"
description = "Plonky3's univariate STARK over BabyBear with a hiding FRI commitment, proving the museum's seven statements."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Built from source only; nothing here is published to crates.io (see the README).
publish = false

[dependencies]
zk-core = { path = "../zk-core" }
zk-circuit = { path = "../zk-circuit" }
zk-examples = { path = "../zk-examples" }
p3-air = "0.7.0"
p3-baby-bear = "0.7.0"
p3-challenger = "0.7.0"
p3-commit = "0.7.0"
p3-dft = "0.7.0"
p3-field = "0.7.0"
p3-fri = "0.7.0"
p3-keccak = "0.7.0"
p3-matrix = "0.7.0"
p3-merkle-tree = "0.7.0"
p3-symmetric = "0.7.0"
p3-uni-stark = "0.7.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = { version = "0.10.1", default-features = false, features = ["std_rng", "sys_rng"] }

[lints]
workspace = true
