[package]
name = "zk-pool"
description = "The Toy Shielded Pool: a local, valueless shielded ledger to shield, send privately, unshield and attack, proved with Groth16 or Halo 2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Built from source only; nothing here is published to crates.io (see the README).
publish = false

[dependencies]
zk-core = { path = "../zk-core" }
zk-circuit = { path = "../zk-circuit" }
zk-examples = { path = "../zk-examples" }
sys-groth16 = { path = "../sys-groth16" }
sys-halo2 = { path = "../sys-halo2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
getrandom = "0.4"
hex = "0.4.3"

[lints]
workspace = true
