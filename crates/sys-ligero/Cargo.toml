[package]
name = "sys-ligero"
description = "Ligero (Ames, Hazay, Ishai, Venkitasubramaniam; CCS 2017): the witness is written into Reed–Solomon-encoded rows, committed column by column in a Merkle tree and checked through random combinations and a few opened columns, trusting nothing but a hash. A teaching implementation of the paper's zero-knowledge argument."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Built from source only; nothing here is published to crates.io (see the README).
publish = false

[dependencies]
zk-core = { path = "../zk-core" }
zk-circuit = { path = "../zk-circuit" }
p3-dft = "0.7.0"
p3-field = "0.7.0"
p3-goldilocks = "0.7.0"
p3-matrix = "0.7.0"
sha2 = { version = "0.11", default-features = false }
getrandom = "0.4"

[lints]
workspace = true
